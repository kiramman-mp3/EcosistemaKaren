<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Supermercado Karen - Portal de Reservas Web</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <div class="logo-icon">🛒</div>
        <div>
          <h1>Supermercado Karen <span class="badge-tag">Portal Web</span></h1>
          <p class="subtitle">Ofertas del Día • Reservas Anti-Overbooking con PIN</p>
        </div>
      </div>
      <div class="widget-card heartbeat-widget">
        <div class="pulse-dot"></div>
        <span class="widget-value">ESTADO TIENDA: ONLINE</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="glass-card">
      <h2>📱 Portal Web de Clientes</h2>
      <p>Explora ofertas vigentes y apartado de stock con pase PIN de 10 minutos (TTL) para pagar en caja SIACI.</p>
    </div>
  </main>
</body>
</html>
