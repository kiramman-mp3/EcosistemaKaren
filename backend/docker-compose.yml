services:
  postgres:
    image: postgres:14-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecosistema_karen}
      POSTGRES_USER: ${DB_USER:-karen_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karen_pass}
    ports:
      # Solo la propia máquina: la base y pgAdmin no deben ser alcanzables desde la red local.
      - "127.0.0.1:${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/store:/docker-entrypoint-initdb.d
      # Datos de demostración (cuentas con contraseña conocida): solo desarrollo. Un compose de producción no lo monta.
      - ./init-db/dev/01-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
    networks:
      - karen_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base de datos de portal-api (ADR-003). Solo se levanta con el perfil "split":
  #   docker compose --profile split up -d
  # El esquema lo aplica portal-api al arrancar (init-db/portal).
  postgres_portal:
    profiles: ["split"]
    image: postgres:14-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PORTAL_DB_NAME:-ecosistema_karen_portal}
      POSTGRES_USER: ${PORTAL_DB_USER:-karen_portal}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-karen_portal_pass}
    ports:
      - "127.0.0.1:${PORTAL_DB_EXPOSED_PORT:-5434}:5432"
    volumes:
      - postgres_portal_data:/var/lib/postgresql/data
    networks:
      - karen_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@karen.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_for_local_use}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - karen_network

volumes:
  postgres_data:
  postgres_portal_data:
  pgadmin_data:

networks:
  karen_network:
    driver: bridge
