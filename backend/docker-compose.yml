services:
  postgres:
    image: postgres:14-alpine
    container_name: karen_postgres
    restart: always
    environment:
      POSTGRES_DB: ecosistema_karen
      POSTGRES_USER: karen_user
      POSTGRES_PASSWORD: karen_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - karen_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: karen_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@karen.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - karen_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  karen_network:
    driver: bridge
