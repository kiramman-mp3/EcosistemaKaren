name: Build Android APK

# Compila los APK del portal móvil (clientes) y de la bodega (personal) en un runner de Linux, que ya
# trae el SDK de Android: no hace falta Android Studio en el PC. Se lanza a mano:
# Actions > Build Android APK > Run workflow. Cada APK queda como artefacto de la ejecución.
# Van firmados con la clave de depuración que genera Expo: sirven para instalar en los teléfonos de la
# tienda, no para publicar en Play Store.
on:
  workflow_dispatch:
    inputs:
      cleartext:
        description: 'Permitir HTTP hacia la red local y elegir el servidor desde la app (builds de prueba)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: portal
            dir: frontend/portal-mobile-reactnative
            artifact: SupermercadoKaren-portal
          - app: bodega
            dir: frontend/bodega-mobile-reactnative
            artifact: SupermercadoKaren-bodega
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      KAREN_ALLOW_CLEARTEXT: ${{ inputs.cleartext && '1' || '' }}
      EXPO_PUBLIC_SERVER_CONFIG: ${{ inputs.cleartext && '1' || '' }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generar el proyecto nativo con Expo
        run: npx expo prebuild --platform android --no-install
      - name: Compilar el APK (solo teléfonos de 64 bits)
        working-directory: ${{ matrix.dir }}/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ matrix.artifact }}.apk" && ls -la "${{ matrix.artifact }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-apk
          path: ${{ matrix.dir }}/${{ matrix.artifact }}.apk
          retention-days: 14
